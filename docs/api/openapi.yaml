  /v1/requirements/validate:
    post:
      operationId: validateRequirement
      summary: Validate a requirement draft (nothing is stored)
      tags:
        - matching
      security:
        - {}
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  default: ""
                  type: string
                  maxLength: 200
                description:
                  type: string
                  minLength: 3
                  maxLength: 8000
                constraints:
                  maxItems: 40
                  type: array
                  items:
                    $ref: "#/$defs/ConstraintInput"
                confidentialTerms:
                  maxItems: 30
                  type: array
                  items:
                    type: string
                    maxLength: 120
              required:
                - description
              $defs:
                ConstraintInput:
                  oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          const: concept
                        conceptId:
                          type: string
                          maxLength: 120
                          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                          description: Ontology concept id, e.g. "qnx". Use search_technologies to find ids.
                        level:
                          default: supports
                          type: string
                          enum:
                            - mentioned
                            - supports
                            - experience
                            - certified
                            - production
                        priority:
                          default: hard
                          type: string
                          enum:
                            - hard
                            - preference
                        qualifiers:
                          default: {}
                          type: object
                          propertyNames:
                            type: string
                            maxLength: 40
                          additionalProperties:
                            type: string
                            maxLength: 120
                      required:
                        - kind
                        - conceptId
                    - type: object
                      properties:
                        kind:
                          type: string
                          const: maturity
                        minimum:
                          type: string
                          enum:
                            - concept
                            - prototype
                            - pilot
                            - production
                        priority:
                          default: hard
                          type: string
                          enum:
                            - hard
                            - preference
                      required:
                        - kind
                        - minimum
                    - type: object
                      properties:
                        kind:
                          type: string
                          const: production_reference
                        priority:
                          default: hard
                          type: string
                          enum:
                            - hard
                            - preference
                      required:
                        - kind
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementValidation"
        4XX: &a82
          description: Error (RFC 9457 problem details)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        5XX: *a82
