paths:
  /.well-known/jwks.json:
    get:
      operationId: jwks
      summary: Public keys for verifying access tokens issued by this deployment
      tags:
        - auth
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties: {}
                required:
                  - keys
                additionalProperties: false
        4XX: &a1
          description: Error (RFC 9457 problem details)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        5XX: *a1
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthAuthorizationServerMetadata
      summary: RFC 8414 authorization server metadata
      tags:
        - oauth
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                propertyNames:
                  type: string
                additionalProperties: {}
        4XX: &a2
          description: Error (RFC 9457 problem details)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        5XX: *a2
  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      tags:
        - system
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
                additionalProperties: false
        4XX: &a3
          description: Error (RFC 9457 problem details)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        5XX: *a3
  /oauth/register:
    post:
      operationId: oauthRegisterClient
      summary: RFC 7591 dynamic client registration (public clients with PKCE)
      tags:
        - oauth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              propertyNames:
                type: string
              additionalProperties: {}
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                propertyNames:
                  type: string
                additionalProperties: {}
        4XX: &a4
          description: Error (RFC 9457 problem details)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        5XX: *a4
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      summary: RFC 7009 token revocation (revokes the whole authorization)
      tags:
        - oauth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: false
        4XX: &a5
          description: Error (RFC 9457 problem details)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        5XX: *a5
  /oauth/token:
    post:
      operationId: oauthToken
      summary: "Token endpoint: authorization_code (PKCE) and refresh_token grants (form-encoded)"
      tags:
        - oauth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: number
                  refresh_token:
                    type: string
                  scope:
                    type: string
                required:
                  - access_token
                  - token_type
                  - expires_in
                  - refresh_token
                  - scope
                additionalProperties: false
        4XX: &a6
          description: Error (RFC 9457 problem details)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        5XX: *a6
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe (database reachable)
      tags:
        - system
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
                required:
                  - status
                additionalProperties: false
        4XX: &a7
          description: Error (RFC 9457 problem details)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        5XX: *a7
  /v1/admin/audit:
    get:
      operationId: adminAuditLog
      summary: Audit events (newest first)
      tags:
        - admin
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
