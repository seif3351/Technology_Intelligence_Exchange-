name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck, lint, unit, contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atx/mcp-server build:views
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm contracts:check

  integration:
    name: Integration (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: atx, POSTGRES_PASSWORD: atx, POSTGRES_DB: atx_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atx" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://atx:atx@localhost:5432/atx_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: atx, POSTGRES_PASSWORD: atx, POSTGRES_DB: atx }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atx" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://atx:atx@localhost:5432/atx
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atx/web exec playwright install --with-deps chromium
      - run: pnpm --filter @atx/web build
      - name: Run browser journeys against the production web build
        run: |
          (cd apps/api && FEATURE_ENGAGEMENT_ACTIONS=true AUTH_RATE_LIMIT_PER_MINUTE=500 LOG_LEVEL=warn pnpm start &)
          (cd apps/web && pnpm start &)
          npx --yes wait-on http://localhost:4000/readyz http://localhost:3000
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  images:
    name: Container images (${{ matrix.image }})
    runs-on: ubuntu-latest
    # Images are only published from main, and only after every test suite passed on that commit.
    needs: [verify, integration, e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: atx-node, dockerfile: infra/docker/node-service.Dockerfile }
          - { image: atx-web, dockerfile: infra/docker/web.Dockerfile }
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # Deploy by immutable commit SHA (ATX_IMAGE_TAG); `main` tracks the latest green build.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
