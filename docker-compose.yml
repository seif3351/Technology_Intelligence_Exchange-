# Local development and production-parity stack.
#   docker compose up -d postgres                 # just the database (run apps with pnpm dev:*)
#   docker compose --profile app up --build       # full stack in containers
#   docker compose --profile observability up -d  # OpenTelemetry collector + Jaeger UI (http://localhost:16686)
#   docker compose --profile storage up -d        # MinIO (S3-compatible) + ClamAV
name: atx

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://atx:atx@postgres:5432/atx
  PUBLIC_WEB_URL: http://localhost:3000
  API_PUBLIC_URL: http://localhost:4000
  MCP_PUBLIC_URL: http://localhost:4100/mcp
  CORS_ORIGINS: http://localhost:3000
  ALLOWED_HOSTS: localhost,127.0.0.1,mcp-server
  TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12
  # Development-only secrets. Production must inject real values from a secret store.
  CONFIRMATION_SECRET: compose-dev-only-confirmation-secret-0123456789
  ASSET_URL_SECRET: compose-dev-only-asset-url-secret-0123456789abcd
  # Generate once with `pnpm auth:generate-key` and export it before `docker compose --profile app up`.
  AUTH_SIGNING_JWK: ${AUTH_SIGNING_JWK:?export AUTH_SIGNING_JWK (pnpm auth:generate-key)}
  STORAGE_DRIVER: filesystem
  STORAGE_DIR: /data/storage
  # Production-mode guards (see packages/config): explicit DB TLS mode, mandatory malware scanning, real mail.
  DATABASE_SSL: 'off' # private compose network only
  CLAMAV_HOST: clamav
  MAIL_DRIVER: ${MAIL_DRIVER:-none}
  SMTP_URL: ${SMTP_URL:-}
  REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
  FEATURE_ENGAGEMENT_ACTIONS: ${FEATURE_ENGAGEMENT_ACTIONS:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atx
      POSTGRES_PASSWORD: atx
      POSTGRES_DB: atx
    ports: ['5432:5432']
    volumes:
      ['pgdata:/var/lib/postgresql/data', './infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atx']
      interval: 5s
      retries: 20

  api:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/node-service.Dockerfile, args: { SERVICE: api } }
    environment: *app-env
    ports: ['4000:4000']
    volumes: ['storage:/data/storage']
    depends_on: { postgres: { condition: service_healthy } }

  mcp-server:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/node-service.Dockerfile, args: { SERVICE: mcp-server } }
    environment: *app-env
    ports: ['4100:4100']
    depends_on: { api: { condition: service_started } }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/node-service.Dockerfile, args: { SERVICE: worker } }
    environment: *app-env
    volumes: ['storage:/data/storage']
    depends_on: { postgres: { condition: service_healthy } }

  web:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
      MCP_PUBLIC_URL: http://localhost:4100/mcp
    ports: ['3000:3000']
    depends_on: { api: { condition: service_started } }

  minio:
    profiles: [storage]
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: atx-dev, MINIO_ROOT_PASSWORD: atx-dev-password }
    ports: ['9000:9000', '9001:9001']

  clamav:
    profiles: [storage, app]
    image: clamav/clamav:stable
    ports: ['3310:3310']

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otel/collector.yaml']
    volumes: ['./infra/otel/collector.yaml:/etc/otel/collector.yaml:ro']
    ports: ['4318:4318']

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:latest
    ports: ['16686:16686']

volumes:
  pgdata:
  storage:
